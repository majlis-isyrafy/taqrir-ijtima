<title>تقرير الاجتماع تحت إشراف المجلس الإشرافي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
:root{--bg:#f5efe3;--card:#fffdf7;--ink:#1f3a1f;--mut:#7a7667;--g1:#173d17;--g2:#2f6b26;--gold:#b8923a;--line:#e6dcc6;--c1:#7a4fa0;--c2:#2a7f86;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a12;--card:#1b261b;--ink:#e8e2d0;--mut:#a9a48f;--line:#2f3d2f}}
:root[data-theme="dark"]{--bg:#121a12;--card:#1b261b;--ink:#e8e2d0;--mut:#a9a48f;--line:#2f3d2f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic','Segoe UI',serif;display:flex;min-height:100vh}
aside{width:250px;flex:none;background:linear-gradient(160deg,#1c4a1c,#102b10);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
aside img{width:130px;display:block;margin:0 auto}
.brand{text-align:center;font-size:12px;letter-spacing:.5px}
.navi{background:#f3ead2;color:#173d17;border-radius:12px;padding:10px 14px;font-weight:700}
.lbl{font-size:12px;color:#d6c27a;margin-top:6px}
aside button.s{background:none;border:0;color:#fff;font:inherit;text-align:right;padding:8px 6px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
aside button.s:hover,aside button.s.on{background:rgba(255,255,255,.12)}
.n{background:rgba(255,255,255,.18);border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.mode{margin-top:auto;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:10px;text-align:center;font-size:14px}
main{flex:1;min-width:0;padding:28px 32px}
h1{margin:0 0 6px;color:var(--g1);font-size:clamp(30px,4.2vw,50px);font-weight:700;line-height:1.35;}
:root[data-theme="dark"] h1{color:#cfe6c4}
.sub{color:var(--gold);margin:4px 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border-radius:16px;padding:16px;border-top:4px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card b{display:block;font-size:30px;color:var(--c)}
.card span{color:var(--mut);font-size:14px}
.card.main{background:var(--g1);color:#fff}.card.main b{color:#fff}.card.main span{color:#e9dfbd}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.pill,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
.pill.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.sec{background:var(--card);border-radius:16px;margin-bottom:22px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden}
.sec h2{margin:0;background:var(--g2);color:#fff;font-size:18px;padding:12px 18px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1500px}
th{background:#e9e1c9;color:#173d17;padding:10px 6px;font-size:14px;border-inline-start:1px solid var(--line)}
:root[data-theme="dark"] th{background:#2a382a;color:#e8e2d0}
td{vertical-align:top;padding:8px;border:1px solid var(--line);min-width:120px;height:90px}
.it{display:flex;align-items:center;gap:4px;margin-bottom:5px;font-size:13px}
.it a{flex:1;background:#e8f1e1;color:#1f5a17;text-decoration:none;border-radius:8px;padding:4px 8px}
:root[data-theme="dark"] .it a{background:#27402a;color:#bfe3b3}
.it button,.add{border:0;background:none;cursor:pointer;color:var(--mut);font:inherit}
.add{border:1px dashed var(--gold);color:var(--gold);border-radius:8px;width:100%;padding:3px}
.frm{display:flex;flex-direction:column;gap:5px}
.frm input,.frm select{font:inherit;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.frm .r{display:flex;gap:4px}.frm .r button{flex:1;border:0;border-radius:8px;padding:4px;cursor:pointer;font:inherit;font-size:12px;background:var(--g2);color:#fff}
.frm .r button+button{background:#999}
.st{color:var(--mut);font-size:13px;margin:0 4px}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}aside img{width:60px;margin:0}.lbl,.mode{display:none}main{padding:18px 14px}h1{font-size:28px}}
.mode{background:none;color:#fff;font:inherit;cursor:pointer;width:100%}.mode:hover{background:rgba(255,255,255,.12)}.msg{text-align:center;color:var(--mut);padding:30px}
:root{--chip:#e8f1e1;--chipt:#1f5a17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip:#27402a;--chipt:#bfe3b3}}
:root[data-theme="dark"]{--chip:#27402a;--chipt:#bfe3b3}
.slot{display:flex;align-items:center;gap:3px;margin-bottom:4px;font-size:12px}
.slot .c{flex:1;border-radius:8px;padding:3px 8px;display:block;min-width:0}
.slot.on .c{background:var(--chip);color:var(--chipt);text-decoration:none}
.slot.off .c{border:1px dashed var(--line);color:var(--mut);background:none;font:inherit;font-size:12px;text-align:right}
.slot.off button.c{cursor:pointer}
.slot .d{display:block;font-size:11px;opacity:.8}
.slot.miss .c{border:1px solid var(--missb);background:var(--missbg);color:var(--misst)}
:root{--missbg:#fde8e8;--misst:#b3261e;--missb:#e3a2a2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--missbg:#4a2222;--misst:#ffb4ab;--missb:#7a3a3a}}
:root[data-theme="dark"]{--missbg:#4a2222;--misst:#ffb4ab;--missb:#7a3a3a}
.frm .nmb{border:1px solid var(--missb);background:var(--missbg);color:var(--misst);border-radius:8px;padding:4px;cursor:pointer;font:inherit;font-size:13px}
.legend{font-size:15px;color:var(--mut);margin:-4px 0 14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--missbg);border:1px solid var(--missb);vertical-align:middle;margin-inline-end:6px}
.slot button.ed{border:0;background:none;cursor:pointer;color:var(--mut);font:inherit;padding:0 2px}
th.now{background:var(--gold)!important;color:#fff!important}td.now{background:rgba(184,146,58,.1)}
.srch{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;width:220px}
td{height:auto}.navi,.lbl{text-align:center;font-size:22px;font-weight:700;line-height:1.4}.lbl{margin-top:10px;font-size:18px}.card{text-align:center}.card b{font-size:36px}.card span{font-size:18px}.sec h2{text-align:center}@media(max-width:800px){.navi,.lbl{font-size:17px}}body{font-size:17px}.slot{font-size:14px}.slot .d{font-size:13px}th{font-size:16px}.frm input,.frm select{font-size:14px}.frm .st{font-size:13px}.sec h2 small{font-size:14px;opacity:.85;font-weight:400;margin-inline-start:10px}
@media print{aside,.bar,.mode,.ed,.msg{display:none!important}body{display:block}main{padding:0}.wrap{overflow:visible}table{min-width:0;font-size:9px}td{min-width:0;padding:3px}.slot{font-size:9px}.sec{break-inside:avoid;box-shadow:none}@page{size:A4 landscape;margin:10mm}}
</style>

function nowH(){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric'}).formatToParts(new Date());
 const g=t=>+(p.find(x=>x.type===t)||{}).value;const y=g('year')||g('relatedYear'),m=g('month');return(y&&m)?{y,m}:{y:1448,m:0}}catch(e){return{y:1448,m:0}}}
const H=nowH();
const ISO=/^\d{4}-\d\d-\d\d$/;

function info(y){if(INFO[y])return INFO[y];const res={};INFO[y]=res;if(!FMT)return res;
 const gy=Math.floor(622.54+(y-1)*0.97022);let t=Date.UTC(gy-1,0,1,12);const end=Date.UTC(gy+2,0,1,12);
 for(;t<end;t+=864e5){let hy,hm;for(const x of FMT.formatToParts(new Date(t))){if(x.type==='year'||x.type==='relatedYear')hy=+x.value;else if(x.type==='month')hm=+x.value}
  if(hy!==y)continue;const o=res[hm]||(res[hm]={first:null,last:null,cnt:[0,0,0,0,0,0,0],dd:[[],[],[],[],[],[],[]]});const dt=new Date(t),iso=dt.toISOString().slice(0,10);
  if(!o.first)o.first=iso;o.last=iso;o.cnt[dt.getUTCDay()]++;o.dd[dt.getUTCDay()].push(iso)}

const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function normD(v){v=String(v||'');if(ISO.test(v))return v;const m=v.match(/^[A-Za-z]{3} ([A-Za-z]{3}) (\d{1,2}) (\d{4})/);
 if(m&&MON[m[1]])return m[3]+'-'+String(MON[m[1]]).padStart(2,'0')+'-'+m[2].padStart(2,'0');return v}
function fmtH(v,full){if(!ISO.test(v))return v;try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',Object.assign({timeZone:'UTC'},full?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long'})).format(new Date(v+'T12:00:00Z'))}catch(e){return v}}

function exportCsv(){

 const blob=new Blob(['\ufeff'+rows.map(r=>r.map(c).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});

 const cards=el('div','cards');
 [['main','إجمالي تقارير هذه السنة',inY.length,'#173d17'],['','اجتماع المجلس الإشرافي',cnt('majlis'),'var(--c1)'],['','اجتماع مدراء المشاريع',cnt('mudaro'),'var(--c2)']].forEach(([k,l,v,c])=>{
  const d=el('div','card '+k);d.style.setProperty('--c',c);d.append(el('b',0,String(v)),el('span',0,l));cards.append(d)});
 app.append(cards);
 const bar=el('div','bar');
 [['all','الكل'],['majlis','المجلس الإشرافي'],['mudaro','مدراء المشاريع']].forEach(([k,l])=>{
  const b=el('button','pill'+(filter===k?' on':''),l);b.onclick=()=>{filter=k;render()};bar.append(b)});
 const sel=el('select');years().forEach(y=>{const o=el('option',0,'سنة '+ar(y));o.value=y;if(y===year)o.selected=true;sel.append(o)});
 sel.onchange=()=>{year=+sel.value;adding=null;render()};bar.append(sel);
 const pb=el('button','pill','🖨 طباعة');pb.onclick=()=>window.print();
 const eb=el('button','pill','⬇ تصدير CSV');eb.onclick=exportCsv;bar.append(pb,eb);app.append(bar);
 const lg=el('div','legend');lg.append(el('i'),document.createTextNode('لا يوجد اجتماع'));app.append(lg);
 Object.keys(SECS).filter(k=>filter==='all'||filter===k).forEach(k=>app.append(table(k)))}
function form(k,m){
 const f=el('div','frm'),ws=el('select');WEEKS.forEach((n,j)=>{const o=el('option',0,n);o.value=j+1;if(j+1===adding.w)o.selected=true;ws.append(o)});
 const u=el('input');u.placeholder='رابط Google Drive';u.dir='ltr';u.value=adding.u||'';
 const dl=el('div','st','التاريخ (اختياري)'),d=el('input');d.type='date';d.dir='ltr';d.value=ISO.test(adding.d||'')?adding.d:'';
 const inf=(info(year)||{})[m];if(inf){d.min=inf.first;d.max=inf.last}
 const pv=el('div','st',d.value?fmtH(d.value,true):'');d.onchange=()=>{pv.textContent=d.value?fmtH(d.value,true):''};
 const err=el('div','st'),rw=el('div','r'),ok=el('button',0,'حفظ'),no=el('button',0,'إلغاء'),nb=el('button','nmb','لا يوجد اجتماع');
 const persist=async(body,btn)=>{
  if(S.items.some(x=>x.s===k&&x.y===year&&x.m===m&&x.w===body.w&&x.id!==adding.id)){err.textContent='هذا الأسبوع مسجل بالفعل';return}
  btn.disabled=true;btn.textContent='…';
  try{if(adding.id){const q2=await post(Object.assign({action:'update',id:adding.id},body));
    if(q2.ok){Object.assign(S.items.find(z=>z.id===adding.id),body);adding=null}else alert('تعذر التعديل')}
   else{const q2=await post(Object.assign({action:'add'},body));
    if(q2.ok){S.items.push(Object.assign({id:q2.id},body));adding=null}else alert('تعذر الحفظ')}}
  catch(e){alert('تعذر الاتصال بالخادم')}render()};
 ok.onclick=()=>{const v=u.value.trim();
  if(!/^https:\/\//.test(v)){u.style.borderColor='#c33';err.textContent='الرابط يجب أن يبدأ بـ https://';return}
  if(d.value&&inf&&(d.value<inf.first||d.value>inf.last)){err.textContent='التاريخ خارج هذا الشهر';return}
  persist({s:k,y:year,m:m,w:+ws.value,u:v,d:d.value.trim()},ok)};
 nb.onclick=()=>persist({s:k,y:year,m:m,w:+ws.value,u:NOMEET,d:''},nb);
 no.onclick=()=>{adding=null;render()};rw.append(ok,no);f.append(ws,u,dl,d,pv,err,rw,nb);return f}
function table(k){
 const box=el('div','sec');const hh=el('h2',0,SECS[k]);hh.append(el('small',0,'(كل يوم '+DAYN[MEET[k]]+')'));box.append(hh);
 const w=el('div','wrap'),t=el('table'),h=el('tr');
 MONTHS.forEach((m,i)=>h.append(el('th',(year===H.y&&i+1===H.m)?'now':'',m)));t.append(h);const r=el('tr');
 MONTHS.forEach((m,i)=>{
  const td=el('td',(year===H.y&&i+1===H.m)?'now':'');
  if(adding&&adding.s===k&&adding.m===i+1){td.append(form(k,i+1));r.append(td);return}
  const nW=weeksIn(k,i+1);
  for(let n=1;n<=nW;n++){
   const x=S.items.find(z=>z.s===k&&z.y===year&&z.m===i+1&&z.w===n);
   const nm=!!x&&x.u===NOMEET;
   const s=el('div','slot '+(x?(nm?'miss':'on'):'off')),lab='الأسبوع '+ar(n);
   if(x){const a=el(nm?'span':'a','c',lab);
    if(!nm){if(/^https:\/\//.test(x.u)){a.href=x.u;a.target='_blank';a.rel='noopener noreferrer'}
     if(x.d)a.append(el('span','d',fmtH(x.d)))}
    s.append(a);
    if(canEdit){const e=el('button','ed','✎');e.title='تعديل';e.onclick=()=>{adding={s:k,m:i+1,w:x.w,u:nm?'':x.u,d:x.d,id:x.id};render()};
     const b=el('button','ed','×');b.title='حذف';b.onclick=async()=>{if(!confirm('حذف هذا الملف؟'))return;msg('جارٍ الحذف…');
      try{const q2=await post({action:'delete',id:x.id});if(q2.ok)S.items=S.items.filter(z=>z!==x);else alert('تعذر الحذف')}catch(e2){alert('تعذر الاتصال بالخادم')}render()};
     s.append(e,b)}}
   else if(canEdit){const b=el('button','c',lab);b.onclick=()=>{adding={s:k,m:i+1,w:n};render()};s.append(b)}
   else s.append(el('span','c',lab));
   td.append(s)}
  r.append(td)});
 t.append(r);w.append(t);box.append(w);return box}
document.querySelectorAll('aside .s').forEach(b=>b.onclick=()=>{filter=b.dataset.s;render()});
document.getElementById('mode').onclick=login;
try{const p=sessionStorage.getItem('pw');if(p){PW=p;post({action:'check'}).then(r=>{if(r.ok)canEdit=true;else PW='';render()}).catch(()=>{})}}catch(e){}
load();
</script>
